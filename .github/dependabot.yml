version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      react:
        patterns: ['react', 'react-*', '@types/react*']
      typescript:
        patterns: ['typescript', '@typescript-eslint/*']
      vite:
        patterns: ['vite', '@vitejs/*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
