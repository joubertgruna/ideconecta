---
services:
  frontend:
    # Keep production frontend image unchanged.
    # Only mount node_modules volume to avoid issues.
    volumes:
      - frontend-node-modules:/app/node_modules

  frontend-dev:
    image: node:20-bullseye
    command: sh -c "npm install --legacy-peer-deps && npm start"
    working_dir: /app
    volumes:
      - ./frontend:/app:delegated
      - frontend-dev-node-modules:/app/node_modules
    ports:
      - '3005:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3005
      - DANGEROUSLY_DISABLE_HOST_CHECK=true

volumes:
  backend-node-modules:
  frontend-node-modules:
  frontend-dev-node-modules:
